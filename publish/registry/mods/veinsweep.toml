changelog = "石头类/泥土类/沙子类三个开关合并为“基础方块”（默认禁止）；修复自然地表上基础方块只沿同种方块连成一条线的问题，改为按类别连通；保留空手触发（默认允许）；版本 0.2.1，仍固定 Horizon 提交 9f42064c（Nightly 2026-11-13）。"
