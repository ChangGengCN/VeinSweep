changelog = "扩散算法改为两类：矿脉/原木固定按整个 3×3×3 邻域（26 向，含棱/角相邻）连通，整条带走，不再受开关影响；泥土、石头、沙子等普通方块改为在“随机扩散半径”（2–8，默认 4）立方体内伪随机连通生长，每次形状不同，最大方块数仍是硬上限。移除“含对角连通”开关，新增“随机扩散半径”。同 ID 扩散、潜行触发、黑名单（起点与邻居）、掉落方式、保留耐久与创造模式行为保持不变。仍固定 Nightly 2026-11-20（0a875da）。"
