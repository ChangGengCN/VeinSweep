sha256 = "6484c398667eb946007170cd6e151ba0dbaf07d892bed6e57c9b9d8200554b50"
changelog = "触发条件改为单一的可自定义按键：注册为 mod 按键映射（默认 V，可在 选项 → 控制 → VeinSweep 中改成任意键盘键或鼠标键），按住它破坏方块才连锁；不再把潜行作为触发方式，也没有无需按键的模式。新增“连锁破坏”总开关（默认开）：关闭后连锁完全停用，挖方块只破坏手动那一块。其余行为不变：同 ID 扩散、矿脉 26 向、普通方块半径内伪随机、黑名单、最大方块数、随机扩散半径、掉落方式、保留工具耐久、创造模式开关、无手持物判定。仍固定 Nightly 2026-11-20（0a875da）。"
