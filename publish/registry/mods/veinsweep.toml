id = "veinsweep"
kind = "native-mod"
name = "VeinSweep"
summary = "按住潜行挖掉一个方块，与它相连的同种方块会一起被挖掉；数量、连通范围、创造模式连锁与黑名单都可调。"
description = """
VeinSweep 是一个连锁挖掘模组：按住**潜行**（Shift）挖掉一个方块，与它相连的**同种方块**会一起被挖掉。
连锁破坏走游戏自己的玩家挖矿流程，掉落、附魔、耐久、统计、经验、粒子和音效都与手动挖一块一致。

- **适用全部可破坏方块**：不再有“基础方块”白名单。矿石、原木、泥土、石头、木板、玻璃等都能连锁；
  只保留必要的保护——破坏速度为负的方块（基岩等）、带方块实体的方块（箱子、熔炉等）不参与。
- **只在同种方块内部扩散**：按方块 ID 判定（忽略朝向等状态）。`oak_log` 的不同朝向互相连锁，
  但不会蔓延到其他原木；`dirt` 不会蔓延到 `grass_block` / `coarse_dirt`，`sand` 不会蔓延到 `gravel`。
- **黑名单**：`/veinsweep blacklist add <方块>`、`remove <方块>`、`list`、`clear`，
  用资源 ID 并支持 Tab 补全；按方块 ID 匹配，保存到
  `horizon-mod-data/veinsweep/blacklist.txt`，重启后仍有效。
- **与手持物无关**：连锁只看“潜行 + 破坏方块”，空手、拿木头、拿镐走同一套范围和规则；
  工具类型与等级都不改变连锁结果。掉落仍按原版（木镐挖钻石矿会连锁，但钻石矿不掉落）。
- **设置页**（选项 → 模组 → VeinSweep → Config）：仅潜行时触发（默认开）、
  最大方块数（8–256，默认 32）、掉落直接入包（默认关）、含对角连通（默认开，
  悬停提示：关=仅六面相邻，开=含棱角共点的 26 向相邻）、
  保留工具耐久（0–10，默认 0）、创造模式连锁（默认关）。
- **创造模式默认不连锁**：创造模式下单击破坏只破一块；在设置里打开“创造模式连锁”
  后才连锁，且仍要满足潜行等其余触发条件。开启后按创造规则不掉落、不耗耐久；
  旁观者始终不触发。

本版本是 `.hmod` 原生 mod（新 mod API，`api = "0.2"`），固定到开发与实测所用的
Horizon 构建 `0a875da91dbb0fdcb7ba8c42c11341aa229af51a`（Nightly 2026-11-20）与
horizon-mixins `e59da9094f0c2fdda6c627fe9eff22dec6a906f0`。Horizon 更新后需要重新构建并发布新版本。
"""
authors = ["your-github-login"]
owners = ["your-github-login"]
license = "MIT"
source = "https://github.com/your-github-login/veinsweep"
icon = "icons/veinsweep.png"
categories = ["game-mechanics", "utility"]
tags = ["vein-mining", "chain-mining", "mining", "blacklist"]

[[versions]]
version = "0.3.7"
published = "2026-11-20"
game = "26.3"
file = "veinsweep-0.3.7.hmod"
sha256 = "a121149296549349853500b3d5f6752168b3efd0e816798d820fb736ef06ff82"
changelog = "连锁只在同种方块内部扩散：按方块 ID 判定（忽略朝向等状态），砍原木不再连带泥土/草方块，挖泥土不再连带草方块/砂土，挖沙子不再连带沙砾/石头；任何可破坏方块仍都能连锁。潜行仍是唯一触发条件，无手持物判定；黑名单、上限、掉落方式、含对角连通、创造模式开关保持原行为。仍固定 Nightly 2026-11-20（0a875da）。"
