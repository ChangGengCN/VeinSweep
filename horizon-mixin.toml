# VeinSweep —— Horizon 连锁挖掘（native mod）
# 构建/安装：horizon-launcher native-build "<此文件夹>" --trust-native-code
[mod]
id = "veinsweep"
version = "0.2.1"
priority = 100

# 本模组除了 catalog 钩子 destroy_block，还调用了 Horizon 内部的
# Game::native_player_break_block（docs/native-mods.md 的
# "Breaking as a player"，专为连锁挖掘/区域工具提供）。
# 它不是稳定 Host 接口（player_break 片段仍 pending），所以固定到
# 开发/测试所用的 Horizon 提交：Nightly 2026-11-13。
[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

# veinsweep.rs 成为 crate::game::veinsweep 模块。
[[module]]
id = "logic"
file = "crates/horizon-client/src/game.rs"
name = "veinsweep"
source = "veinsweep.rs"

# 玩家开始破坏一个方块时（NeoForge BlockEvent.BreakEvent 的位置）触发。
[[injection]]
id = "vn_chain"
kind = "HEAD"
hook = "destroy_block"
hook_version = 1
helper = "chain.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# Options > Mods 里的一行。
[[injection]]
id = "vn_list"
kind = "HEAD"
hook = "mods"
hook_version = 1
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# 该行的设置页按钮。
[[injection]]
id = "vn_page"
kind = "HEAD"
hook = "settings"
hook_version = 1
helper = "page.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

# 设置页按钮点击。
[[injection]]
id = "vn_click"
kind = "HEAD"
hook = "settings_click"
hook_version = 1
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
