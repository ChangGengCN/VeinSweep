id = "veinsweep"
name = "VeinSweep"
version = "0.6.2"
description = """
按住潜行键（默认，可在控制中改）挖掉一个方块时，与它相连的同种方块会一起被挖掉。矿脉和原木整条带走，泥土、石头等普通方块在附近连成不规则的一片。只在同种方块内扩散，与手里拿什么无关；工具中途损坏会立即停止，可以随时关闭。

Chain mining: hold the sneak key (default; rebindable in Controls) while breaking a block to also break the matching blocks connected to it. Ores and logs come out as a whole vein, while dirt, stone and similar blocks break in an irregular patch nearby. It only spreads through the same block type, works with any held item, stops as soon as the tool breaks, and can be switched off at any time.
"""
authors = ["ChangGengCN"]
license = "MIT"
api = "0.2"
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
