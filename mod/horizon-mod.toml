id = "veinsweep"
name = "VeinSweep"
version = "0.6.0"
description = "Chain mining: hold the sneak key (default; rebindable in Controls) while breaking a block to also break the matching blocks connected to it. Ores and logs come out as a whole vein, while dirt, stone and similar blocks break in an irregular patch nearby. It only spreads through the same block type, works with any held item, and can be switched off at any time."
